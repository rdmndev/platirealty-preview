name: Обновить курс
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/refresh-rates.mjs
      - run: |
          git config user.name "rates-bot"
          git config user.email "rates-bot@users.noreply.github.com"
          git add api/rates-snapshot.json api/rates.php
          git commit -m "Курс $(date -u +%FT%TZ)" && git push || echo "без изменений"
